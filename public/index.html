<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <div class="theme-slider"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1 class="title">Voice Assistant</h1>
            <p class="subtitle">Hold to speak, release to get response</p>
        </div>
        
        <div class="voice-interface">
            <button id="recordBtn" class="record-btn">
                <div class="mic-icon">🎤</div>
                <div class="btn-text">TALK</div>
            </button>
            
            <div id="status" class="status">Ready to listen</div>
            
            <div class="wave-animation" id="waveAnimation">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>
        
        <div id="response" class="response empty">
            <div class="response-content">
                AI response will appear here...
            </div>
        </div>
        
        <div id="error" class="error"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
