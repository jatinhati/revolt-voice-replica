<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant</title>
    <style>
        :root {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --accent: #00d4ff;
            --accent-hover: #00b8e6;
            --record-btn: #ff6b6b;
            --record-btn-active: #ff4757;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            --bg-primary: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            --bg-secondary: rgba(255, 255, 255, 0.05);
            --text-primary: #e0e0e0;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent: #00ffff;
            --accent-hover: #00e6e6;
            --record-btn: #ff3366;
            --record-btn-active: #ff1a4d;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 500px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 3rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--accent), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
        }

        .voice-interface {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .voice-interface:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .record-btn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, var(--record-btn), var(--record-btn-active));
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 1rem auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
            position: relative;
            overflow: hidden;
        }

        .record-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .record-btn:hover::before {
            opacity: 1;
            animation: shine 1.5s ease-in-out infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .record-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.4);
        }

        .record-btn.recording {
            background: linear-gradient(45deg, var(--record-btn-active), #ff1744);
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 30px rgba(255, 23, 68, 0.6);
        }
        
        .record-btn.ai-speaking {
            background: linear-gradient(45deg, var(--accent), var(--accent-hover));
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 25px rgba(0, 212, 255, 0.5); }
            to { box-shadow: 0 0 35px rgba(0, 212, 255, 0.8); }
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 23, 68, 0.6); }
            50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(255, 23, 68, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 23, 68, 0.6); }
        }

        .mic-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .btn-text {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .status {
            margin: 1.5rem 0;
            font-size: 1.1rem;
            color: var(--text-secondary);
            min-height: 1.5rem;
            transition: all 0.3s ease;
        }

        .status.active {
            color: var(--accent);
            font-weight: 500;
        }

        .response {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1.6;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .response::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .response.new-message::before {
            left: 100%;
        }

        .error {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ffcccb;
            padding: 1rem;
            border-radius: 15px;
            margin: 1rem 0;
            backdrop-filter: blur(10px);
            display: none;
        }

        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            width: 60px;
            height: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            padding: 3px;
        }

        .theme-toggle::before {
            content: '☀️';
            position: absolute;
            left: 8px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .theme-toggle::after {
            content: '🌙';
            position: absolute;
            right: 8px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .theme-slider {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] .theme-slider {
            transform: translateX(30px);
        }

        .wave-animation {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 100px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .wave-animation.active {
            opacity: 0.3;
        }

        .wave {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            transform: translateX(-50%);
            animation: wave 1.5s ease-in-out infinite;
        }

        .wave:nth-child(2) { animation-delay: 0.1s; left: 45%; }
        .wave:nth-child(3) { animation-delay: 0.2s; left: 55%; }
        .wave:nth-child(4) { animation-delay: 0.3s; left: 40%; }
        .wave:nth-child(5) { animation-delay: 0.4s; left: 60%; }

        @keyframes wave {
            0%, 100% { transform: translateX(-50%) scale(0.5); opacity: 0.5; }
            50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        @media (max-width: 600px) {
            .title { font-size: 2rem; }
            .voice-interface { padding: 2rem 1.5rem; }
            .record-btn { width: 120px; height: 120px; }
            .theme-toggle { top: 1rem; right: 1rem; }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <div class="theme-slider"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1 class="title">Voice Assistant</h1>
            <p class="subtitle">Hold to speak, release to get response</p>
        </div>
        
        <div class="voice-interface">
            <button id="recordBtn" class="record-btn">
                <div class="mic-icon">🎤</div>
                <div class="btn-text">TALK</div>
            </button>
            
            <div id="status" class="status">Ready to listen</div>
            
            <div class="wave-animation" id="waveAnimation">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>
        
        <div id="response" class="response">
            AI response will appear here...
        </div>
        
        <div id="error" class="error"></div>
    </div>
    
    <script>
        class SimpleVoiceAssistant {
            constructor() {
                this.mediaRecorder = null;
                this.audioChunks = [];
                this.isRecording = false;
                this.isAISpeaking = false;
                this.currentUtterance = null;
                this.autoStopTimeout = null;
                
                this.recordBtn = document.getElementById('recordBtn');
                this.status = document.getElementById('status');
                this.response = document.getElementById('response');
                this.error = document.getElementById('error');
                this.waveAnimation = document.getElementById('waveAnimation');
                this.themeToggle = document.getElementById('themeToggle');
                
                this.initializeEventListeners();
                this.initializeTheme();
            }
            
            initializeTheme() {
                const savedTheme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', savedTheme);
                
                this.themeToggle.addEventListener('click', () => {
                    const currentTheme = document.documentElement.getAttribute('data-theme');
                    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                    
                    document.documentElement.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }
            
            initializeEventListeners() {
                // Mouse events
                this.recordBtn.addEventListener('mousedown', () => {
                    if (this.isRecording && this.autoStopTimeout) {
                        // If auto-listening, stop it
                        this.stopAutoListening();
                    } else {
                        this.startRecording();
                    }
                });
                this.recordBtn.addEventListener('mouseup', () => this.stopRecording());
                this.recordBtn.addEventListener('mouseleave', () => this.stopRecording());
                
                // Touch events for mobile
                this.recordBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.isRecording && this.autoStopTimeout) {
                        this.stopAutoListening();
                    } else {
                        this.startRecording();
                    }
                });
                this.recordBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.stopRecording();
                });
            }
            
            async startRecording() {
                if (this.isRecording) return;
                
                // If AI is speaking, interrupt it
                if (this.isAISpeaking) {
                    this.interruptAI();
                }
                
                try {
                    this.hideError();
                    this.status.textContent = 'Listening...';
                    this.status.classList.add('active');
                    this.waveAnimation.classList.add('active');
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true
                        }
                    });
                    
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.audioChunks = [];
                    
                    this.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            this.audioChunks.push(event.data);
                        }
                    };
                    
                    this.mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(track => track.stop());
                        this.processRecording();
                    };
                    
                    this.mediaRecorder.start();
                    this.isRecording = true;
                    this.recordBtn.classList.add('recording');
                    
                } catch (error) {
                    this.showError('Microphone access denied. Please allow microphone access.');
                    this.resetUI();
                }
            }
            
            stopRecording() {
                if (!this.isRecording) return;
                
                this.mediaRecorder.stop();
                this.isRecording = false;
                this.recordBtn.classList.remove('recording');
                this.waveAnimation.classList.remove('active');
                this.status.textContent = 'Processing...';
            }
            
            async processRecording() {
                try {
                    if (this.audioChunks.length === 0) {
                        this.showError('No audio recorded');
                        return;
                    }
                    
                    const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                    const base64Audio = await this.blobToBase64(audioBlob);
                    
                    // Send to backend
                    const response = await fetch('/api/voice', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ audioData: base64Audio })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        this.displayResponse(result.text);
                        this.resetUI();
                        
                        // Use text-to-speech for audio response
                        if ('speechSynthesis' in window) {
                            this.speakResponse(result.text);
                        }
                    } else {
                        this.showError(result.error);
                    }
                    
                } catch (error) {
                    this.showError('Failed to process recording: ' + error.message);
                }
            }
            
            displayResponse(text) {
                this.response.textContent = text;
                this.response.classList.add('new-message');
                setTimeout(() => {
                    this.response.classList.remove('new-message');
                }, 500);
            }
            
            resetUI() {
                this.status.textContent = 'Ready to listen';
                this.status.classList.remove('active');
                this.waveAnimation.classList.remove('active');
                this.recordBtn.classList.remove('ai-speaking');
                this.recordBtn.querySelector('.btn-text').textContent = 'TALK';
            }
            
            async autoStartListening() {
                // Only auto-start if not already recording and no errors
                if (this.isRecording || this.error.style.display !== 'none') {
                    return;
                }
                
                try {
                    this.status.textContent = 'Auto-listening... (Speak now or click to stop)';
                    this.status.classList.add('active');
                    this.waveAnimation.classList.add('active');
                    this.recordBtn.classList.add('recording');
                    this.recordBtn.querySelector('.btn-text').textContent = 'LISTENING';
                    
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true
                        }
                    });
                    
                    this.mediaRecorder = new MediaRecorder(stream);
                    this.audioChunks = [];
                    
                    this.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            this.audioChunks.push(event.data);
                        }
                    };
                    
                    this.mediaRecorder.onstop = () => {
                        stream.getTracks().forEach(track => track.stop());
                        this.processRecording();
                    };
                    
                    this.mediaRecorder.start();
                    this.isRecording = true;
                    
                    // Auto-stop after 10 seconds if no manual stop
                    this.autoStopTimeout = setTimeout(() => {
                        if (this.isRecording) {
                            this.stopAutoListening();
                        }
                    }, 10000);
                    
                } catch (error) {
                    console.log('Auto-listening failed:', error.message);
                    this.resetUI();
                }
            }
            
            stopAutoListening() {
                if (this.autoStopTimeout) {
                    clearTimeout(this.autoStopTimeout);
                    this.autoStopTimeout = null;
                }
                
                if (this.isRecording && this.mediaRecorder) {
                    this.mediaRecorder.stop();
                    this.isRecording = false;
                    this.recordBtn.classList.remove('recording');
                    this.waveAnimation.classList.remove('active');
                    this.status.textContent = 'Processing...';
                }
            }
            
            blobToBase64(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => {
                        const base64 = reader.result.split(',')[1];
                        resolve(base64);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            }
            
            showError(message) {
                this.error.textContent = message;
                this.error.style.display = 'block';
                this.resetUI();
                setTimeout(() => this.hideError(), 5000);
            }
            
            hideError() {
                this.error.style.display = 'none';
            }
            
            speakResponse(text) {
                // Stop any current speech
                if (this.currentUtterance) {
                    speechSynthesis.cancel();
                }
                
                this.currentUtterance = new SpeechSynthesisUtterance(text);
                this.currentUtterance.rate = 1.1;
                this.currentUtterance.pitch = 1.0;
                
                // Track AI speaking state
                this.currentUtterance.onstart = () => {
                    this.isAISpeaking = true;
                    this.status.textContent = 'AI speaking... (Hold button to interrupt)';
                    this.status.classList.add('active');
                    this.recordBtn.classList.add('ai-speaking');
                    this.recordBtn.querySelector('.btn-text').textContent = 'INTERRUPT';
                };
                
                this.currentUtterance.onend = () => {
                    this.isAISpeaking = false;
                    this.resetUI();
                    
                    // Auto-start listening for next request
                    setTimeout(() => {
                        this.autoStartListening();
                    }, 500); // Small delay for natural flow
                };
                
                this.currentUtterance.onerror = () => {
                    this.isAISpeaking = false;
                    this.resetUI();
                    
                    // Auto-start listening even if speech fails
                    setTimeout(() => {
                        this.autoStartListening();
                    }, 500);
                };
                
                speechSynthesis.speak(this.currentUtterance);
            }
            
            interruptAI() {
                console.log('🛑 Interrupting AI...');
                
                // Stop speech synthesis immediately
                if (speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                }
                
                // Reset AI speaking state
                this.isAISpeaking = false;
                this.currentUtterance = null;
                
                // Update UI
                this.status.textContent = 'Interrupted - Now listening...';
                this.status.classList.add('active');
                
                // Add visual feedback for interruption
                this.response.style.opacity = '0.5';
                setTimeout(() => {
                    this.response.style.opacity = '1';
                }, 300);
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new SimpleVoiceAssistant();
        });
    </script>
</body>
</html>
